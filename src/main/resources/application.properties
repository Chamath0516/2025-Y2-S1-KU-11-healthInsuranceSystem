spring.application.name=healthInsuranceSystem

# src/main/resources/application.properties
server.port=8081

# Server Configuration
# Added 'trustServerCertificate=true' to the URL to fix the SSL connection issue.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FP10;trustServerCertificate=true

spring.datasource.username=sa
spring.datasource.password=2003
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Debug logging for authentication
logging.level.org.springframework.security=DEBUG
logging.level.com.hims.healthinsurancesystem=DEBUG

# Date formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.mvc.format.date=yyyy-MM-dd

## SEC - Removed default user to avoid conflict with database users
