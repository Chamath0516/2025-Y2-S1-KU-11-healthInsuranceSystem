<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Available Insurance Plans</title>
  <!-- Add CSS links here -->
</head>
<body>
<h1>Our Insurance Plans</h1>
<div th:each="plan : ${plans}">
  <h2 th:text="${plan.planName}">Plan Name</h2>
  <p th:text="${plan.description}">Description</p>
  <p>Coverage: <span th:text="${plan.coverageAmount}">0.00</span></p>
  <a th:href="@{/apply(planId=${plan.planID})}">Apply Now</a>
  <hr/>
</div>
</body>
</html>
