<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Policies - Insurance Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css" />
    <style>
        body {
            background: #f7f9fc;
            font-family: 'Poppins', sans-serif;
        }
        .navbar {
            background-color: #0d6efd;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .status-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
            color: #fff;
        }
        .status-PENDING { background-color: #ffc107; }
        .status-APPROVED { background-color: #28a745; }
        .status-REJECTED { background-color: #dc3545; }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="#">Agent Dashboard</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a href="agent-dashboard.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="manage-policies.html" class="nav-link">Manage Policies</a></li>
            <li class="nav-item"><a href="view-customers.html" class="nav-link active">View Customers</a></li>
            <li class="nav-item"><a href="messages.html" class="nav-link">Messages</a></li>
        </ul>
    </div>
</nav>


<div class="container py-5">
    <h2 class="mb-4 text-center fw-bold">Manage Policies</h2>

    <div class="text-end mb-3">
        <button class="btn btn-outline-secondary btn-sm" onclick="loadPolicies()">↻ Refresh</button>
    </div>

    <div id="policyCards" class="row g-4"></div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/policies"; // adjust if needed
    const AGENT_ID = 1; // TODO: dynamically set from session or login data

    async function loadPolicies() {
        const container = document.getElementById("policyCards");
        container.innerHTML = "<p class='text-center text-muted'>Loading policies...</p>";

        try {
            const res = await fetch(API_BASE);
            if (!res.ok) throw new Error("Failed to load policies");
            const policies = await res.json();

            container.innerHTML = "";
            if (policies.length === 0) {
                container.innerHTML = "<p class='text-center text-muted'>No policies found.</p>";
                return;
            }

            policies.forEach(p => {
                const card = document.createElement("div");
                card.className = "col-md-4";

                const statusClass = "status-" + p.status.toUpperCase();
                card.innerHTML = `
            <div class="card p-3">
              <div class="card-body">
                <h5 class="card-title fw-bold">${p.insurancePlan?.name || 'Unknown Plan'}</h5>
                <h6 class="card-subtitle mb-2 text-muted">Policy No: ${p.policyNumber}</h6>
                <p class="card-text">
                  <strong>Customer:</strong> ${p.customer?.fullName || 'N/A'}<br>
                  <strong>Age:</strong> ${p.customerAge || '-'}<br>
                  <strong>Start Date:</strong> ${p.startDate || '-'}<br>
                  <strong>Status:</strong>
                  <span class="status-badge ${statusClass}">${p.status}</span>
                </p>
                <div class="d-flex justify-content-between">
                  <button class="btn btn-success btn-sm" onclick="approvePolicy(${p.id})" ${p.status === 'APPROVED' ? 'disabled' : ''}>Approve</button>
                  <button class="btn btn-danger btn-sm" onclick="rejectPolicy(${p.id})" ${p.status === 'REJECTED' ? 'disabled' : ''}>Reject</button>
                </div>
              </div>
            </div>
          `;
                container.appendChild(card);
            });

        } catch (err) {
            console.error(err);
            container.innerHTML = "<p class='text-danger text-center'>Error loading policies.</p>";
        }
    }

    async function approvePolicy(policyId) {
        if (!confirm("Approve this policy?")) return;
        try {
            const res = await fetch(`${API_BASE}/${policyId}/approve?agentId=${AGENT_ID}`, { method: "PUT" });
            if (!res.ok) throw new Error("Approval failed");
            alert("✅ Policy approved successfully!");
            loadPolicies();
        } catch (err) {
            console.error(err);
            alert("Error approving policy");
        }
    }

    async function rejectPolicy(policyId) {
        if (!confirm("Reject this policy?")) return;
        try {
            const res = await fetch(`${API_BASE}/${policyId}/reject`, { method: "PUT" });
            if (!res.ok) throw new Error("Rejection failed");
            alert("❌ Policy rejected!");
            loadPolicies();
        } catch (err) {
            console.error(err);
            alert("Error rejecting policy");
        }
    }

    document.addEventListener("DOMContentLoaded", loadPolicies);
</script>
</body>
</html>
