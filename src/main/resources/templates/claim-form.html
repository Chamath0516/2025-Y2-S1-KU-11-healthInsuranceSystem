<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isReadOnly} ? 'View Claim' : (${isEditing} ? 'Edit Claim' : 'New Claim')">Claim Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Your CSS styles are good, no changes needed */
        .autocomplete-container { position: relative; }
        .autocomplete-results { position: absolute; top: 100%; left: 0; right: 0; z-index: 99; border: 1px solid #ced4da; border-top: none; max-height: 200px; overflow-y: auto; background-color: #fff; }
        .autocomplete-item { padding: 0.5rem 1rem; cursor: pointer; }
        .autocomplete-item:hover { background-color: #e9ecef; }
    </style>
</head>
<body>
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h3 th:text="${isReadOnly} ? 'View Claim #' + ${claim.id} : (${isEditing} ? 'Edit Claim #' + ${claim.id} : 'Submit a New Insurance Claim')">Claim Details</h3>
                </div>
                <div class="card-body">
                    <form th:object="${claimDto}"
                          th:action="${isEditing} ? @{/customer/claims/update/{id}(id=${claim.id})} : @{/customer/claims/submit}"
                          method="post" enctype="multipart/form-data">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <!-- --- THIS IS THE FIX --- -->
                        <div class="mb-3">
                            <label for="policy" class="form-label">Policy</label>
                            <!-- The th:field attribute is now on the <select> tag where it belongs. -->
                            <select id="policy" th:field="*{policyId}" class="form-select" th:disabled="${isReadOnly or isEditing}">
                                <option value="">-- Choose a policy --</option>
                                <!-- This single th:each block now handles all cases -->
                                <option th:each="p : ${policies}"
                                        th:value="${p.id}"
                                        th:text="${p.policyNumber + ' - ' + p.insurancePlan?.name}"></option>
                            </select>

                            <!-- This hidden input still correctly handles the 'edit' case -->
                            <input type="hidden" th:if="${isEditing}" name="policyId" th:value="*{policyId}" />

                            <div class="text-danger" th:if="${#fields.hasErrors('policyId')}" th:errors="*{policyId}"></div>
                        </div>
                        <!-- --- END OF FIX --- -->

                        <div class="mb-3 autocomplete-container">
                            <label for="hospital-search" class="form-label">Hospital/Clinic</label>
                            <input type="text" id="hospital-search" class="form-control" th:value="${claim?.provider?.hospital?.name}" th:disabled="${isReadOnly or isEditing}" placeholder="Start typing hospital name...">
                            <input type="hidden" id="hospitalId" th:field="*{hospitalId}">
                            <div id="hospital-results" class="autocomplete-results list-group"></div>
                            <div class="text-danger" th:if="${#fields.hasErrors('hospitalId')}" th:errors="*{hospitalId}"></div>
                        </div>

                        <div class="mb-3 autocomplete-container">
                            <label for="doctor-search" class="form-label">Doctor</label>
                            <input type="text" id="doctor-search" class="form-control" th:value="${claim?.provider != null ? claim.provider.firstName + ' ' + claim.provider.lastName : ''}" th:disabled="${isReadOnly or isEditing or claimDto.hospitalId == null}" placeholder="Select a hospital first...">
                            <input type="hidden" id="providerId" th:field="*{providerId}">
                            <div id="doctor-results" class="autocomplete-results list-group"></div>
                            <div class="text-danger" th:if="${#fields.hasErrors('providerId')}" th:errors="*{providerId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description of Treatment</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="3" th:disabled="${isReadOnly}"></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Claim Amount ($)</label>
                            <input type="number" step="0.01" id="amount" th:field="*{amount}" class="form-control" th:disabled="${isReadOnly}">
                            <div class="text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="document" class="form-label">Supporting Document</label>
                            <div th:if="${claim?.documentName != null}" class="mb-2">
                                <a th:href="@{/customer/claims/{id}/document(id=${claim.id})}" class="btn btn-success">Download <span th:text="${claim.documentName}"></span></a>
                            </div>
                            <div th:if="${!isReadOnly}">
                                <input type="file" id="document" name="document" class="form-control">
                                <small th:if="${isEditing}" class="form-text text-muted">Only select a new file if you want to replace the existing one.</small>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button th:if="${!isReadOnly}" type="submit" class="btn btn-primary btn-lg" th:text="${isEditing} ? 'Update Claim' : 'Submit Claim'">Submit</button>
                            <a th:href="@{/customer/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Replace the ENTIRE <script> block at the bottom of your file with this -->
<!-- Replace the ENTIRE <script> block at the bottom of your file with this -->
<script th:if="${!isReadOnly}">
    // === DOM Elements ===
    const hospitalSearchInput = document.getElementById('hospital-search');
    const hospitalIdInput = document.getElementById('hospitalId');
    const hospitalResultsDiv = document.getElementById('hospital-results');

    const doctorSearchInput = document.getElementById('doctor-search');
    const providerIdInput = document.getElementById('providerId');
    const doctorResultsDiv = document.getElementById('doctor-results');
    const providerErrorDiv = document.getElementById('provider-error');

    // === Functions ===

    // This function sets up the event listeners for the doctor search.
    // It's the key to the fix.
    const initializeDoctorSearch = () => {
        // First, remove any old listeners to prevent duplicates
        doctorSearchInput.removeEventListener('focus', handleDoctorFocus);
        doctorSearchInput.removeEventListener('input', handleDoctorInput);

        // Then, add the fresh listeners
        doctorSearchInput.addEventListener('focus', handleDoctorFocus);
        doctorSearchInput.addEventListener('input', handleDoctorInput);
    };

    const fetchAndDisplayDoctors = async (query) => {
        if (providerErrorDiv) providerErrorDiv.style.display = 'none';

        const hospitalId = hospitalIdInput.value;
        if (!hospitalId) return;

        const response = await fetch(`/api/search/doctors?hospitalId=${hospitalId}&query=${encodeURIComponent(query)}`);
        const doctors = await response.json();
        doctorResultsDiv.innerHTML = '';
        doctors.forEach(doctor => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item list-group-item list-group-item-action';
            item.textContent = `${doctor.firstName} ${doctor.lastName} - ${doctor.specialization}`;
            item.addEventListener('click', () => {
                doctorSearchInput.value = `${doctor.firstName} ${doctor.lastName}`;
                providerIdInput.value = doctor.id;
                doctorResultsDiv.innerHTML = '';
            });
            doctorResultsDiv.appendChild(item);
        });
    };

    // Define handler functions to be able to remove them later
    const handleDoctorFocus = () => fetchAndDisplayDoctors('');
    const handleDoctorInput = () => fetchAndDisplayDoctors(doctorSearchInput.value);

    // === Hospital Search (The Trigger) ===
    if (hospitalSearchInput) {
        const fetchAndDisplayHospitals = async (query) => {
            const response = await fetch(`/api/search/hospitals?query=${encodeURIComponent(query)}`);
            const hospitals = await response.json();
            hospitalResultsDiv.innerHTML = '';
            hospitals.forEach(hospital => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item list-group-item list-group-item-action';
                item.textContent = hospital.name;
                item.addEventListener('click', () => {
                    hospitalSearchInput.value = hospital.name;
                    hospitalIdInput.value = hospital.id;
                    hospitalResultsDiv.innerHTML = '';
                    doctorSearchInput.disabled = false;
                    doctorSearchInput.placeholder = 'Click or start typing doctor name...';
                    doctorSearchInput.value = '';
                    providerIdInput.value = '';

                    // **THE FIX IN ACTION**: Initialize the doctor search *after*
                    // the doctor input has been enabled.
                    initializeDoctorSearch();
                });
                hospitalResultsDiv.appendChild(item);
            });
        };
        hospitalSearchInput.addEventListener('focus', () => fetchAndDisplayHospitals(''));
        hospitalSearchInput.addEventListener('input', () => fetchAndDisplayHospitals(hospitalSearchInput.value));
    }

    // === Initial Page Load Logic ===
    // If the doctor input is ALREADY enabled when the page loads (e.g., after a validation error),
    // initialize it immediately.
    if (doctorSearchInput && !doctorSearchInput.disabled) {
        initializeDoctorSearch();
    }

    // General logic to hide results divs
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.autocomplete-container')) {
            if(hospitalResultsDiv) hospitalResultsDiv.innerHTML = '';
            if(doctorResultsDiv) doctorResultsDiv.innerHTML = '';
        }
    });
</script>

</body>
</html>
