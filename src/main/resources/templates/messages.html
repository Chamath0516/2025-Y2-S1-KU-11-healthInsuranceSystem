<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Messages | Agent Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css" />

    <style>
        body { background-color: #f8f9fa; font-family: "Poppins", sans-serif; }
        .navbar { background-color: #0d6efd; }
        .navbar-brand, .nav-link { color: white !important; }
        .chat-container { background: white; border-radius: 10px; padding: 20px; height: 80vh; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 10px; }
        .message { margin: 8px 0; padding: 10px 15px; border-radius: 15px; max-width: 75%; word-wrap: break-word; }
        .sent { background-color: #0d6efd; color: white; margin-left: auto; }
        .received { background-color: #e9ecef; color: #000; margin-right: auto; }
        .message small { display: block; font-size: 0.75rem; color: #6c757d; margin-top: 3px; }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="/agent/dashboard">Agent Dashboard</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a href="/agent/dashboard" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="/agent/dashboard#plans" class="nav-link">Manage Plans</a></li>
            <li class="nav-item"><a href="/view-customers" class="nav-link">View Customers</a></li>
            <li class="nav-item"><a href="/messages" class="nav-link active">Messages</a></li>
        </ul>
    </div>
</nav>

<!-- Chat Section -->
<div class="container py-4">
    <div class="chat-container shadow-sm">
        <div class="row g-3 align-items-end mb-3">
            <div class="col-md-8">
                <label for="receiverId" class="form-label fw-semibold">Select Customer</label>
                <select class="form-select" id="receiverId"></select>
            </div>
            <div class="col-md-4">
                <label for="senderId" class="form-label">Sender (Agent) ID</label>
                <input class="form-control" id="senderId" type="number" value="2" />
                <div class="form-text">Temporary until login is enabled</div>
            </div>
        </div>

        <div id="messages" class="messages border-top border-bottom"></div>

        <div class="input-group">
            <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
            <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<!-- Bootstrap + JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_BASE = "/api"; // use relative base to avoid CORS
    const messagesDiv = document.getElementById("messages");
    const receiverSelect = document.getElementById("receiverId");
    const senderInput = document.getElementById("senderId");

    function fullName(u) {
        if (!u) return "";
        const name = [u.firstName, u.lastName].filter(Boolean).join(" ");
        return name || u.username || `User#${u.id}`;
    }

    // Load all customers
    async function loadCustomers() {
        try {
            const res = await fetch(`${API_BASE}/users?role=CUSTOMER`);
            if (!res.ok) throw new Error("Failed to load customers");
            const customers = await res.json();
            if (!Array.isArray(customers) || customers.length === 0) {
                receiverSelect.innerHTML = '<option value="">No customers available</option>';
                return;
            }
            receiverSelect.innerHTML = customers.map(c =>
                `<option value="${c.id}">${fullName(c)} (${c.username})</option>`
            ).join("");
        } catch (err) {
            console.error(err);
            receiverSelect.innerHTML = '<option value="">Error loading customers</option>';
        }
    }

    // Load chat conversation between agent and selected customer
    async function loadConversation() {
        const receiverId = receiverSelect.value;
        const agentId = Number(senderInput.value || 0);
        if (!receiverId || !agentId) return;
        try {
            const res = await fetch(`${API_BASE}/notifications/conversation?user1Id=${agentId}&user2Id=${receiverId}`);
            const conversation = res.ok ? await res.json() : [];
            displayMessages(conversation, agentId);
        } catch (err) {
            console.error(err);
        }
    }

    // Send a message
    async function sendMessage() {
        const receiverId = receiverSelect.value;
        const agentId = Number(senderInput.value || 0);
        const message = document.getElementById("messageInput").value.trim();
        if (!receiverId || !agentId) {
            alert("Please select a customer and provide your agent ID.");
            return;
        }
        if (!message) return;

        try {
            const res = await fetch(`${API_BASE}/notifications/send?senderId=${agentId}&receiverId=${receiverId}&message=${encodeURIComponent(message)}`, {
                method: "POST"
            });
            if (!res.ok) throw new Error("Failed to send message");
            document.getElementById("messageInput").value = "";
            await loadConversation();
        } catch (err) {
            console.error(err);
            alert("Failed to send message");
        }
    }

    // Display chat messages
    function displayMessages(conversation, agentId) {
        if (!Array.isArray(conversation)) conversation = [];
        messagesDiv.innerHTML = conversation.map(m => `
        <div class="message ${m.sender && m.sender.id === agentId ? 'sent' : 'received'}">
          <div>${m.message}</div>
          <small>${m.sentAt ? new Date(m.sentAt).toLocaleString() : ''}</small>
        </div>
      `).join("");
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Event Listeners
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keydown", (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    receiverSelect.addEventListener("change", loadConversation);
    senderInput.addEventListener("change", loadConversation);

    // Initialize
    loadCustomers().then(loadConversation);
    setInterval(loadConversation, 5000); // Auto-refresh every 5s
</script>

</body>
</html>
