<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Provide Additional Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Provide Additional Information</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card">
        <div class="card-body">
            <p><strong>Pending Claim ID:</strong> <span th:text="${pendingClaim.id}"></span></p>
            <p><strong>CPO Message:</strong> <span th:text="${pendingClaim.informationRequestMessage}"></span></p>
            <form th:action="@{/customer/pending-claims/{id}/respond(id=${pendingClaim.id})}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Your Response</label>
                    <textarea name="responseText" class="form-control" rows="6" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Upload PDF (optional)</label>
                    <input type="file" name="responseDocument" accept="application/pdf" class="form-control" />
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/customer/submit-claim" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Response</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
