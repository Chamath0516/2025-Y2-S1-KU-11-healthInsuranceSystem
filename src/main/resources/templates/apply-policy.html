<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply for Policy | Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css" />
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Apply for an Insurance Policy</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <h5 class="mb-1" th:text="${customer != null ? customer.firstName + ' ' + customer.lastName : 'Customer'}">Customer Name</h5>
                        <div class="text-muted" th:if="${customer != null}">Username: <span th:text="${customer.username}">username</span></div>
                    </div>

                    <div id="alert" class="alert d-none" role="alert"></div>

                    <form id="applyForm" onsubmit="return submitApplication(event)">
                        <div class="mb-3">
                            <label for="planId" class="form-label">Select Insurance Plan</label>
                            <select id="planId" name="planId" class="form-select" required>
                                <option value="" disabled th:if="${#lists.isEmpty(plans)}" selected>No plans available</option>
                                <option th:each="p : ${plans}" th:value="${p.id}" th:text="${p.name + ' - Premium: ' + p.premium + ', Coverage: ' + p.coverageAmount}" th:selected="${selectedPlanId != null and p.id == selectedPlanId}">Plan</option>
                            </select>
                        </div>

                        <div class="mb-3 small text-muted">
                            Start and end dates will be selected by an insurance agent during approval.
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Submit Application</button>
                            <a href="/customer/dashboard" class="btn btn-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function submitApplication(e){
    e.preventDefault();
    const planId = Number(document.getElementById('planId').value);
    if(!planId){
        showAlert('Please select a plan.', 'danger');
        return false;
    }
    try {
        const res = await fetch('/api/policies/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ planId })
        });
        const text = await res.text();
        if(res.ok){
            showAlert('Application submitted successfully. Awaiting agent approval.', 'success');
            setTimeout(()=>{ window.location.href = '/customer/dashboard'; }, 800);
        } else {
            showAlert('Failed to submit application: ' + text, 'danger');
        }
    } catch(err){
        showAlert('An error occurred while submitting the application.', 'danger');
        console.error(err);
    }
    return false;
}
function showAlert(msg, type){
    const el = document.getElementById('alert');
    el.className = 'alert alert-' + type;
    el.textContent = msg;
}
</script>
</body>
</html>
