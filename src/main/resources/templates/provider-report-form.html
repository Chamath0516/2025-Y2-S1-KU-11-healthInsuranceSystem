<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit / Edit Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${submission != null ? 'Edit Report' : 'Submit Report'}">Submit Report</h2>
        <a th:href="@{/provider/dashboard}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>

    <!-- Flash messages (success / error) -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Pending Claim ID:</strong> <span th:text="${pendingClaim.id}">-</span></p>
            <p><strong>Customer:</strong>
                <span th:if="${pendingClaim.customer != null}" th:text="${pendingClaim.customer.firstName + ' ' + pendingClaim.customer.lastName}"></span>
                <span th:if="${pendingClaim.customer == null}">-</span>
            </p>
            <p><strong>Description:</strong></p>
            <p th:text="${pendingClaim.description != null ? pendingClaim.description : '-'}"></p>
            <p><strong>Amount:</strong> <span th:text="${pendingClaim.amount != null ? ('$' + #numbers.formatDecimal(pendingClaim.amount,1,'COMMA',2,'POINT')) : '-'}"></span></p>
        </div>
    </div>

    <form th:action="@{/provider/claims/{id}/report(id=${pendingClaim.id})}" method="post" enctype="multipart/form-data">
        <!-- Render CSRF hidden input only when _csrf is available to avoid SpEL null-property errors -->
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="card">
            <div class="card-header">
                <h4>Doctor's Report</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="justification" class="form-label">Justification / Notes</label>
                    <textarea id="justification" name="justification" class="form-control" rows="6" required
                              th:text="${submission != null ? submission.justification : ''}"></textarea>
                </div>

                <div class="mb-3">
                    <label for="file" class="form-label">Upload Report (optional)</label>
                    <input type="file" id="file" name="file" class="form-control">
                    <div class="mt-2" th:if="${submission != null and submission.reportDocumentName != null}">
                        Current file: <a th:href="@{'/cpo/to-claim-officer/' + ${submission.id} + '/doctor-document'}" th:text="${submission.reportDocumentName}"></a>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Report</button>
                    <a th:href="@{/provider/claims/{id}/view(id=${pendingClaim.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
