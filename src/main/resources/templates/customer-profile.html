<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Profile</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 500px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"] { 
            width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; 
        }
        button { 
            background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; 
        }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .back-link { margin-top: 20px; }
    </style>
</head>
<body>
<h2>Manage Profile</h2>
<form th:action="@{/customer/profile}" th:object="${customer}" method="post">

    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" th:field="*{firstName}" required pattern="^[A-Za-z]+$"/><br/>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" th:field="*{lastName}" required pattern="^[A-Za-z]+$"/><br/>

    <label for="email">Email:</label>
    <input type="email" id="email" th:field="*{email}" required pattern="^[A-Za-z0-9._%+-]+@[A-Za-z.-]+\.[A-Za-z]+$"/><br/>

    <label for="contactNumber">Contact Number:</label>
    <input type="text" id="contactNumber" th:field="*{contactNumber}" required pattern="^\d{10}$" maxlength="10" oninput="validateContactNumber(this)"/>
    <span id="contact-error" style="color:red"></span><br/>

    <label for="dateOfBirth">Date of Birth:</label>
    <input type="date" id="dateOfBirth" name="dateOfBirth" th:value="${customer.dateOfBirth}"/>
    <span th:if="${customer.dateOfBirth}" style="color: blue; font-size: 12px;">
        (Current: <span th:text="${customer.dateOfBirth}"></span>)
    </span><br/>

    <label for="gender">Gender:</label>
    <input type="text" id="gender" th:field="*{gender}" required/><br/>

    <label for="address.street">Street:</label>
    <input type="text" id="address.street" th:field="*{address.street}" th:value="${customer.address?.street ?: ''}" required/><br/>
    <label for="address.city">City:</label>
    <input type="text" id="address.city" th:field="*{address.city}" th:value="${customer.address?.city ?: ''}" required/><br/>
    <label for="address.state">State:</label>
    <input type="text" id="address.state" th:field="*{address.state}" th:value="${customer.address?.state ?: ''}" required/><br/>
    <label for="address.zipCode">Zip Code:</label>
    <input type="text" id="address.zipCode" th:field="*{address.zipCode}" th:value="${customer.address?.zipCode ?: ''}" required/><br/>

    <button type="submit">Update Profile</button>
</form>

<div th:if="${successMessage}" class="success">[[${successMessage}]]</div>
<div th:if="${errorMessage}" class="error">[[${errorMessage}]]</div>

<div class="back-link">
    <a th:href="@{/customer/dashboard}">← Back to Dashboard</a>
</div>

<script>
    function validateContactNumber(input) {
        const errorSpan = document.getElementById('contact-error');
        // Remove any non-digit characters
        input.value = input.value.replace(/\D/g, '');
        
        if (input.value.length > 10) {
            input.value = input.value.slice(0, 10);
        }
        
        if (input.value.length === 0) {
            errorSpan.textContent = 'Contact number is required';
            return false;
        } else if (input.value.length < 10) {
            errorSpan.textContent = 'Contact number must be exactly 10 digits';
            return false;
        } else {
            errorSpan.textContent = '';
            return true;
        }
    }
</script>

</body>
</html>
