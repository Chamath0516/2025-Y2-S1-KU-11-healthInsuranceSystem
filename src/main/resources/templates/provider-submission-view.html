<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Provider Submission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Provider Submission</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Pending Claim ID:</strong> <span th:text="${submission.pendingClaimId}"></span></p>
            <p><strong>Provider:</strong> <span th:text="${submission.providerFirstName + ' ' + submission.providerLastName}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${submission.customerFirstName + ' ' + submission.customerLastName}"></span></p>
            <p><strong>Justification:</strong></p>
            <p th:text="${submission.justification}"></p>
            <div th:if="${submission.reportDocumentName}">
                <p><strong>Uploaded document:</strong> <span th:text="${submission.reportDocumentName}"></span></p>
            </div>
            <a href="/provider/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
