<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="password"] { 
            width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; 
        }
        button { 
            background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; 
        }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .back-link { margin-top: 20px; }
    </style>
</head>
<body>
<h2>Change Password</h2>

<div th:if="${successMessage}" class="success">[[${successMessage}]]</div>
<div th:if="${errorMessage}" class="error">[[${errorMessage}]]</div>

<form th:action="@{/customer/change-password}" method="post" onsubmit="return validatePasswords()">
    <label for="oldPassword">Current Password:</label>
    <input type="password" id="oldPassword" name="oldPassword" required/><br/>

    <label for="newPassword">New Password:</label>
    <input type="password" id="newPassword" name="newPassword" required minlength="5"/><br/>

    <label for="confirmNewPassword">Confirm New Password:</label>
    <input type="password" id="confirmNewPassword" name="confirmNewPassword" required/><br/>

    <button type="submit">Change Password</button>
</form>

<div class="back-link">
    <a th:href="@{/customer/dashboard}">← Back to Dashboard</a>
</div>

<script>
    function validatePasswords() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;
        
        if (newPassword.length < 5) {
            alert('New password must be at least 5 characters long.');
            return false;
        }
        
        if (newPassword !== confirmPassword) {
            alert('New passwords do not match.');
            return false;
        }
        
        return true;
    }
</script>

</body>
</html>
