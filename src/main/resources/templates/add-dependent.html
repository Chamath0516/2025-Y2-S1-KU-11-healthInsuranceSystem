<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Dependent - HealthSure</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, #476EAE, #48B3AF, #A7E399, #F6FF99);
            border-radius: 10px;
        }

        h2 {
            color: #2c3e50;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #34495e;
            font-size: 1rem;
            font-weight: 400;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 5px;
            background: linear-gradient(to bottom, #476EAE, #48B3AF, #A7E399);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #34495e;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #476EAE;
            box-shadow: 0 0 0 2px rgba(71, 110, 174, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(to right, #476EAE, #48B3AF);
            color: white;
            box-shadow: 0 3px 8px rgba(71, 110, 174, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(71, 110, 174, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(to right, #34495e, #5d6d7e);
            color: white;
            box-shadow: 0 3px 8px rgba(52, 73, 94, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(52, 73, 94, 0.4);
        }

        .flash-message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #f8f9fa;
            border-left: 4px solid #476EAE;
            display: flex;
            align-items: center;
        }

        .flash-message.success {
            border-left-color: #A7E399;
            background-color: #f0f9ee;
        }

        .flash-message.error {
            border-left-color: #ff6b6b;
            background-color: #fef0f0;
        }

        .flash-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Add Dependent</h2>
        <p class="subtitle">Add a new dependent to your HealthSure policy</p>
    </div>

    <!-- Example flash message (can be conditionally shown) -->
    <div class="flash-message success">
        <span class="flash-icon">✓</span>
        <span>Dependent added successfully!</span>
    </div>

    <div class="card">
        <form th:action="@{/customer/add-dependent}" th:object="${dependent}" method="post">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" th:field="*{firstName}" required placeholder="Enter first name"/>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" th:field="*{lastName}" required placeholder="Enter last name"/>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth:</label>
                <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required/>
            </div>

            <div class="form-group">
                <label for="relationshipToCustomer">Relationship to Customer:</label>
                <input type="text" id="relationshipToCustomer" th:field="*{relationshipToCustomer}" required placeholder="e.g., Spouse, Child, Parent"/>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Add Dependent</button>
                <a th:href="@{/customer/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </form>
    </div>

    <div style="text-align: center; margin-top: 20px; color: #7f8c8d; font-size: 0.9rem;">
        <p>HealthSure Insurance &copy; 2023. All rights reserved.</p>
    </div>
</div>
</body>
</html>
